<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八字命盤 V3.5 | 專業修復版</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; line-height: 1.6; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 900px; }
        h1 { text-align: center; color: #2c3e50; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 150px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-calc { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result-box { margin-top: 30px; display: none; }
        .luck-box { background: linear-gradient(to right, #2c3e50, #4ca1af); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .luck-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
        .luck-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; }
        .luck-scan-list { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 5px; margin-top: 15px; font-size: 14px; }
        .luck-scan-list ul { padding-left: 20px; margin: 0; }
        .luck-tag-clash { background: #ff6b6b; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .luck-tag-combine { background: #2ecc71; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .luck-tag-super { background: linear-gradient(45deg, #f1c40f, #e67e22); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .chart-table { width: 100%; border-collapse: collapse; margin: 20px 0; text-align: center; }
        .chart-table th, .chart-table td { border: 1px solid #eee; padding: 10px; }
        .gan-zhi { font-size: 22px; font-weight: bold; }
        .wood { color: #27ae60; } .fire { color: #c0392b; } .earth { color: #d35400; } .metal { color: #f39c12; } .water { color: #2980b9; }
        .analysis-card { background: #f8f9fa; padding: 20px; border-left: 5px solid #764ba2; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-yin-yang"></i> 宸和 八字命理系統 </h1>
    
    <div class="form-row">
        <div class="input-group"><label>出生日期</label><input type="date" id="birthDate"></div>
        <div class="input-group"><label>時間</label><input type="time" id="birthTime" value="12:00"></div>
    </div>
    <button class="btn-calc" onclick="calculateBazi()">開始解析</button>

    <div id="result" class="result-box">
        <div class="luck-box">
            <div class="luck-grid">
                <div class="luck-item"><div>流年</div><div id="curYear"></div></div>
                <div class="luck-item"><div>流月</div><div id="curMonth"></div></div>
                <div class="luck-item"><div>流日</div><div id="curDay"></div></div>
                <div class="luck-item"><div>流時</div><div id="curHour"></div></div>
            </div>
            <div class="luck-scan-list" id="currentLuckAdvice">正在掃描...</div>
        </div>

        <table class="chart-table">
            <thead><tr><th>年柱</th><th>月柱</th><th>日柱</th><th>時柱</th></tr></thead>
            <tbody>
                <tr id="ganRow"><td></td><td></td><td></td><td></td></tr>
                <tr id="zhiRow"><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>

        <div class="analysis-card">
            <h4><i class="fas fa-user"></i> 性格與格局</h4>
            <div id="analysisText"></div>
        </div>
    </div>
</div>

<script>
    const Wuxing = { "甲":"木", "乙":"木", "寅":"木", "卯":"木", "丙":"火", "丁":"火", "巳":"火", "午":"火", "戊":"土", "己":"土", "辰":"土", "戌":"土", "丑":"土", "未":"土", "庚":"金", "辛":"金", "申":"金", "酉":"金", "壬":"水", "癸":"水", "亥":"水", "子":"水" };
    const mapClass = {'木':'wood','火':'fire','土':'earth','金':'metal','水':'water'};

    function calculateBazi() {
        const d = document.getElementById('birthDate').value;
        const t = document.getElementById('birthTime').value;
        if (!d) return alert('請輸入日期');

        const [yy, mm, dd] = d.split('-').map(Number);
        const [h, min] = t.split(':').map(Number);
        const solar = Solar.fromYmdHms(yy, mm, dd, h, min, 0);
        const baZi = solar.getLunar().getEightChar();

        document.getElementById('result').style.display = 'block';
        
        // 渲染八字
        const gans = [baZi.getYearGan(), baZi.getMonthGan(), baZi.getDayGan(), baZi.getTimeGan()];
        const zhis = [baZi.getYearZhi(), baZi.getMonthZhi(), baZi.getDayZhi(), baZi.getTimeZhi()];
        
        const ganTds = document.getElementById('ganRow').children;
        const zhiTds = document.getElementById('zhiRow').children;

        for(let i=0; i<4; i++) {
            ganTds[i].innerHTML = `<span class="gan-zhi ${mapClass[Wuxing[gans[i]]]}">${gans[i]}</span>`;
            zhiTds[i].innerHTML = `<span class="gan-zhi ${mapClass[Wuxing[zhis[i]]]}">${zhis[i]}</span>`;
        }

        analyzeDetailedCurrentLuck(baZi);
    }

    function analyzeDetailedCurrentLuck(baZi) {
        const now = new Date();
        const cur = Solar.fromDate(now).getLunar().getEightChar();
        
        document.getElementById('curYear').innerText = cur.getYearGan() + cur.getYearZhi();
        document.getElementById('curMonth').innerText = cur.getMonthGan() + cur.getMonthZhi();
        document.getElementById('curDay').innerText = cur.getDayGan() + cur.getDayZhi();
        document.getElementById('curHour').innerText = cur.getTimeGan() + cur.getTimeZhi();

        const chongMap = {'子':'午', '午':'子', '丑':'未', '未':'丑', '寅':'申', '申':'寅', '卯':'酉', '酉':'卯', '辰':'戌', '戌':'辰', '巳':'亥', '亥':'巳'};
        const heMap = {'子':'丑', '丑':'子', '寅':'亥', '亥':'寅', '卯':'戌', '戌':'卯', '辰':'酉', '酉':'辰', '巳':'申', '申':'巳', '午':'未', '未':'午'};
        const ganHeMap = { '甲':'己', '己':'甲', '乙':'庚', '庚':'乙', '丙':'辛', '辛':'丙', '丁':'壬', '壬':'丁', '戊':'癸', '癸':'戊' };
        
        let findings = [];
        const userP = [
            {n:'年柱', g:baZi.getYearGan(), z:baZi.getYearZhi()},
            {n:'月柱', g:baZi.getMonthGan(), z:baZi.getMonthZhi()},
            {n:'日柱', g:baZi.getDayGan(), z:baZi.getDayZhi()},
            {n:'時柱', g:baZi.getTimeGan(), z:baZi.getTimeZhi()}
        ];
        const currP = [
            {n:'流年', g:cur.getYearGan(), z:cur.getYearZhi()},
            {n:'流月', g:cur.getMonthGan(), z:cur.getMonthZhi()},
            {n:'流日', g:cur.getDayGan(), z:cur.getDayZhi()}
        ];

        currP.forEach(c => {
            userP.forEach(u => {
                // 優先判定天地德合
                if (ganHeMap[u.g] === c.g && heMap[u.z] === c.z) {
                    findings.push(`<li><span class="luck-tag-super">⭐天地德合</span> 您的${u.n}與${c.n}鴛鴦相合，大吉！</li>`);
                } else {
                    if (chongMap[u.z] === c.z) findings.push(`<li><span class="luck-tag-clash">沖</span> ${c.n}沖${u.n}：注意變動與情緒壓力。</li>`);
                    if (heMap[u.z] === c.z) findings.push(`<li><span class="luck-tag-combine">合</span> ${c.n}合${u.n}：易有貴人與合作契機。</li>`);
                    if (u.g === c.g && u.z === c.z) findings.push(`<li><span class="luck-tag-warn">伏吟</span> ${c.n}與${u.n}相同：能量重疊，宜靜不宜動。</li>`);
                }
            });
        });

        document.getElementById('currentLuckAdvice').innerHTML = findings.length ? `<ul>${findings.join('')}</ul>` : "今日氣場平穩，適合按部就班。";
    }
</script>
</body>
</html>
